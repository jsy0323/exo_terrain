collection:
  visualization_config: configs/visualize.yaml
  checkpoint: logs/humanoid_walk_run/model_best.pt
  output_dir: data/force_estimation
  episodes: 30
  duration_s: 20.0
  seed: 20261117

sample_rate_hz: 100
window_s: 1.0
contact_threshold_n: 20.0
subject:
  height_m: 1.75
  thigh_length_m: 0.42
  shank_length_m: 0.43
  foot_length_m: 0.26

imu:
  position_offset_m: 0.02
  angle_offset_deg: 5.0
  gyro_noise_std: 0.02
  gyro_bias: 0.02
  acc_noise_std: 0.05
  acc_bias: 0.1
  vibration_hz: [5.0, 15.0]
  vibration_max_mps2: 0.3
  delay_ms: [0.0, 5.0]
  dropout_probability: 0.0

encoder:
  quantization_rad: 0.001
  noise_std_rad: 0.002
  cutoff_hz: 30.0

fsr:
  deadzone: [0.0, 20.0]
  gain: [0.7, 1.3]
  alpha: [0.7, 1.3]
  f_sat: [400.0, 1200.0]
  lag_coef: [0.3, 1.0]
  creep: [0.0, 0.0001]
  bias: [-0.02, 0.02]
  sigma: 0.01
  boundary_offset_m: 0.015
  calibration_value: 500.0
  control_dt_s: 0.02

training:
  include_exo_features: false
  target: bio  # bio or total. All three torque contributions are stored.
  output_dir: models/force_estimator
  epochs: 30
  batch_size: 32
  stride_samples: 10
  learning_rate: 0.001
  validation_fraction: 0.2
  test_fraction: 0.2
  seed: 42
  device: cuda
  dropout: 0.1
  torque_scale_nm: 50.0
  grf_scale_n: 750.0
